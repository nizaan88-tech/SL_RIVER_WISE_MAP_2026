<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Noto Sans Tamil','Latha','Nirmala UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(160deg,#0b3d91,#1177c9 45%,#14a37f);color:#fff;overflow:auto}

.sl{width:150px;height:auto;margin-bottom:10px;opacity:.9}
.big{background:#fff;color:#0b3d91;border:0;border-radius:40px;padding:14px 38px;font:800 20px inherit;font-family:inherit;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.tabs{display:flex;gap:6px;padding:8px 8px 0;background:var(--card);border-bottom:1px solid var(--bd)}

.tabs button.on{color:var(--ac);border-color:var(--ac)}
#wrap{flex:1;position:relative;min-height:0;background:#fff}
#sc{position:absolute;inset:0;overflow:auto}
#svg{display:block;margin:0 auto}
.fl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}

#ctl{background:var(--card);border-top:1px solid var(--bd);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#ctl select{flex:1 1 150px;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:15px inherit;font-family:inherit}

 $('nx').onclick=next;$('pv').onclick=()=>{if(!shown.length)return;const o=shown.pop();tapped.delete(key(o));cur=shown.length?shown[shown.length-1]:null;render();prog();const q=seq(riv);if(cur){focus(cur);say(`<b style="color:${col(riv,38)}">${riv}</b> — ${shown.length}/${q.length} ${tab=='p'?'இடங்கள்':'குளங்கள்'} குறிக்கப்பட்டன. தொட்டுப் பெயரைப் பாருங்கள்.`)}else say('தொடக்கத்தில் உள்ளீர்கள். அடுத்து பொத்தானை அழுத்துங்கள்.')};
 reset();say('நதியைத் தெரிவு செய்து <b>அடுத்து</b> அழுத்துங்கள்.')}
$('svg').addEventListener('click',e=>{const k=e.target.closest&&e.target.closest('[data-k]');if(!k)return;const v=k.dataset.k;tapped.has(v)?tapped.delete(v):tapped.add(v);render()});
$('go').onclick=()=>{$('home').style.display='none';$('app').classList.add('on');setTab('p');fit()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{setTab(b.dataset.t);fit()});
$('zi').onclick=()=>zoom(1.3);$('zo').onclick=()=>zoom(1/1.3);$('zf').onclick=fit;
let lw=innerWidth;addEventListener('resize',()=>{if(!$('app').classList.contains('on'))return;if(innerWidth!=lw){lw=innerWidth;fit()}else{render()}});addEventListener('orientationchange',()=>setTimeout(fit,300));
</script></body></html>
